[project]
name = "claude-code-mlx-proxy"
authors = [ { name = "Daniel Bacsur", email = "daniel@danielbacsur.dev" } ]
description = "A local proxy that brings MLX models into Claude Code."

version = "0.1.0"
dependencies = [ "mlx-lm>=0.31.3" ]
requires-python = ">=3.10,<3.15"


[project.scripts]
claude-code-mlx-proxy = "claude_code_mlx_proxy:main"

[build-system]
build-backend = "uv_build"
requires = [ "uv-build>=0.13,<0.14" ]
